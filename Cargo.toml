[package]
name = "sound-checker"
version = "0.1.0"
edition = "2021"
description = "Test microphones and audio inputs on Linux"
license = "MIT"

[dependencies]
gtk = { package = "gtk4", version = "0.11", features = ["v4_10"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_4"] }
libpulse-binding = "2.30"
libpulse-glib-binding = "2.29"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

# pipewire-pulse can hand libpulse-binding sink/source states outside its enum
# (e.g. -3 "unlinked"); with debug assertions on, rustc's enum UB check aborts
# inside the binding's own conversion before our code sees the value.
[profile.dev.package.libpulse-binding]
debug-assertions = false
